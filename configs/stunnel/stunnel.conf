pid = /run/stunnel4/stunnel.pid
setuid = stunnel4
setgid = stunnel4

[ssh-dropbear]
    accept = 0.0.0.0:445
    connect = 127.0.0.1:109
    cert = /etc/stunnel/stunnel.pem

[ssh-dropbear2]
    accept = 0.0.0.0:844
    connect = 127.0.0.1:143
    cert = /etc/stunnel/stunnel.pem

[ssh-dropbear3]
    accept = 0.0.0.0:444
    connect = 127.0.0.1:90
    cert = /etc/stunnel/stunnel.pem
