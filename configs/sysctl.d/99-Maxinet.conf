# ============ Maxinet Network — OPTIMIZACION LXC ============
# Solo parametros validos para contenedores LXC
# NOTA: rmem_max, wmem_max, swappiness, default_qdisc,
# netdev_max_backlog NO existen o estan bloqueados por el host.

# Congestion TCP — BBR
net.ipv4.tcp_congestion_control=bbr

# Buffers TCP (289 MB / 289 MB)
net.ipv4.tcp_rmem=4096 87380 303038464
net.ipv4.tcp_wmem=4096 87380 303038464
net.ipv4.tcp_mtu_probing=1
net.ipv4.tcp_slow_start_after_idle=0
net.ipv4.tcp_low_latency=1

# Colas y conexiones
net.core.somaxconn=8192
net.ipv4.tcp_max_syn_backlog=8192
net.ipv4.tcp_fin_timeout=15
net.ipv4.tcp_keepalive_time=300
net.ipv4.tcp_keepalive_intvl=15
net.ipv4.tcp_keepalive_probes=5
net.ipv4.tcp_tw_reuse=1
net.ipv4.ip_local_port_range=1024 65000
net.ipv4.tcp_timestamps=1

# Limites
fs.file-max=2097152
